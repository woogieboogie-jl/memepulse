<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0D0D0D" stroke="#00FF41" stroke-width="1.5"/>
  
  <!-- Pulse/heartbeat line representing oracle data -->
  <path 
    d="M4 16 L8 16 L10 10 L13 22 L16 8 L19 20 L22 14 L24 16 L28 16" 
    stroke="#00FF41" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
  />
  
  <!-- Gold accent dot at peak -->
  <circle cx="16" cy="8" r="2" fill="#F7D51D"/>
  
  <!-- Small M indicator -->
  <text x="16" y="29" font-family="monospace" font-size="5" fill="#F7D51D" text-anchor="middle" font-weight="bold">$M</text>
</svg>
